<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>まちがいさがし</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fce4ec">

    <!-- iOS Safari PWA対応 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="まちがいさがし">
    <link rel="apple-touch-icon" href="assets/icon-192.png">

    <!-- アプリ説明 -->
    <meta name="description" content="こどもむけ まちがいさがしゲーム - 30ステージで遊ぼう！">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="game-container">
        <!-- タイトル画面 -->
        <div id="title-screen" class="title-screen">
            <h1 class="title-logo">🌟まちがいさがし🌟</h1>
            <div class="title-image-container">
                <img src="assets/stage1_left.png" alt="タイトル画像" class="title-image">
            </div>
            <button id="start-button" class="start-btn">スタート！</button>
        </div>

        <!-- ゲーム画面（初期は非表示） -->
        <div id="game-ui" class="hidden-screen">
            <!-- ヘッダー：タイトルと進捗、タイマー表示 -->
            <header class="game-header">
                <div class="header-top">
                    <h1>🌟 まちがいさがし <span id="level-display">Lv.1</span> 🌟</h1>
                    <div class="score-display">🏆 <span id="score-display">0</span>てん</div>
                    <div class="progress-container" id="star-container">
                        <!-- JSによって星が動的に追加されます -->
                    </div>
                </div>
                <!-- タイマープログレスバー -->
                <div class="timer-container">
                    <div id="timer-bar" class="timer-bar"></div>
                </div>
            </header>

            <!-- メイン画面：2つのパネルを並べる -->
            <main class="panels-container">
                <!-- お手本パネル（左） -->
                <div class="panel" id="panel-left">
                    <div class="panel-background"></div>
                    <!-- アイテムがJSでここに追加されます -->
                </div>

                <!-- 問題パネル（右） -->
                <div class="panel" id="panel-right">
                    <div class="panel-background"></div>
                    <!-- アイテムがJSでここに追加され、間違いが設定されます -->
                </div>
            </main>
        </div>

        <!-- クリア/ゲームオーバー画面（非表示） -->
        <div id="clear-screen" class="hidden-screen">
            <div class="clear-message">
                <h2 id="result-title">🎉 やったね！ 🎉</h2>
                <p id="result-desc">ぜんぶ みつけたよ！</p>
                <div class="score-result">
                    <p id="stage-score-display"></p>
                    <p id="total-score-display"></p>
                </div>
                <div class="clear-animation">🎊✨👦👧✨🎊</div>
                <button id="replay-button">もう１かい あそぶ</button>
            </div>
        </div>
    </div>

    <!-- 正解時のエフェクト用コンテナ -->
    <div id="effect-container"></div>

    <!-- PC向け スマホですぐ遊べるQRコード案内 -->
    <div class="qr-code-container">
        <p>スマホで遊ぶ！</p>
        <img id="qr-code-img" alt="スマホ用QRコード">
        <p id="qr-url-text" style="font-size:10px;color:#888;margin-top:4px;word-break:break-all;"></p>
    </div>

    <script>
        // 現在のURLからQRコードを動的に生成
        (function () {
            const img = document.getElementById('qr-code-img');
            const urlText = document.getElementById('qr-url-text');
            const protocol = window.location.protocol;
            const host = window.location.hostname;
            const port = window.location.port;

            if (protocol === 'file:') {
                // file:// で開いている場合 → スマホからアクセス不可
                img.style.display = 'none';
                urlText.innerHTML = '📱 スマホで遊ぶには<br>PCでターミナルを開き：<br><strong style="color:#e53e3e">python3 -m http.server 8080</strong><br>（このフォルダで実行）<br>その後ブラウザで<br><strong>http://&lt;PCのIPアドレス&gt;:8080</strong><br>にアクセスしてください';
            } else if (host === 'localhost' || host === '127.0.0.1') {
                // localhostの場合、スマホからはアクセスできないので案内を表示
                img.style.display = 'none';
                const p = port ? ':' + port : '';
                urlText.innerHTML = 'スマホからアクセスするには<br>ブラウザのURLを<br><strong>http://192.168.x.x' + p + '</strong><br>に変更してください<br>（PCのIPアドレスを確認）';
            } else {
                // IPアドレスでアクセスしている場合はQRコード生成
                const portPart = port ? ':' + port : '';
                const gameUrl = protocol + '//' + host + portPart + '/';
                const qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent(gameUrl);
                img.src = qrSrc;
                urlText.textContent = gameUrl;
            }
        })();
    </script>

    <script src="js/script.js"></script>

    <!-- Service Worker登録 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('SW registered:', reg.scope))
                    .catch((err) => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>

</html>
